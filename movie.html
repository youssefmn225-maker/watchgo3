<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الفيلم - WatchGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #9b51e0; --bg: #050505; --text: #ffffff; --imdb-gold: #f5c518; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        
        .movie-layout { display: grid; grid-template-columns: 300px 1fr 250px; gap: 20px; max-width: 1200px; margin: auto; }
        .poster { width: 100%; border-radius: 12px; border: 2px solid #333; }
        
        /* إضافة التقييم وزر التريلر */
        .poster-meta { display: flex; gap: 10px; margin-top: 10px; }
        .imdb-badge { background: var(--imdb-gold); color: #000; padding: 5px 12px; border-radius: 5px; font-weight: bold; font-size: 16px; }
        .trailer-btn { background: #222; border: 1px solid #444; padding: 5px 12px; border-radius: 5px; color: #fff; text-decoration: none; font-size: 14px; }
        
        .info-section h1 { color: var(--primary); margin-top: 0; }
        .details-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .row span:first-child { color: var(--primary); font-weight: bold; }
        
        .action-panel { display: flex; flex-direction: column; gap: 10px; }
        .btn { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .btn.download { background: #333; border: 1px solid #555; }

        .related-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-top: 30px; }
        .related-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }

        @media (max-width: 768px) {
            .movie-layout { grid-template-columns: 1fr; }
            .related-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="movie-layout">
        <div class="poster-container">
            <img src="" id="poster" class="poster">
            <div class="poster-meta">
                <div class="imdb-badge" id="imdbRate"><i class="fa-solid fa-star"></i> IMDb --</div>
                <a href="#" id="trailerLink" target="_blank" class="trailer-btn"><i class="fa-solid fa-tv"></i> مشاهدة التريلر</a>
            </div>
        </div>

        <div class="info-section">
            <h1 id="movieTitle">جاري التحميل...</h1>
            <div style="color: var(--primary); font-weight:bold; margin-bottom:10px;">قصة الفيلم</div>
            <p id="movieOverview" style="color: #ccc; line-height: 1.6;">جاري تحميل تفاصيل القصة...</p>
            
            <div class="details-box">
                <div class="row"><span>القسم:</span><span id="detCategory">---</span></div>
                <div class="row"><span>النوع:</span><span id="detGenre">---</span></div>
                <div class="row"><span>الجودة:</span><span>1080p WEB-DL</span></div>
                <div class="row"><span>التوقيت:</span><span id="detRuntime">-- دقيقة</span></div>
                <div class="row"><span>موعد الصدور:</span><span id="detYear">----</span></div>
                <div class="row"><span>اللغة:</span><span id="detLang">---</span></div>
                <div class="row"><span>الدولة:</span><span id="detCountry">---</span></div>
            </div>
        </div>

        <div class="action-panel">
            <a href="#" class="btn"><i class="fa-solid fa-play"></i> مشاهدة الآن</a>
            <a href="#" class="btn download"><i class="fa-solid fa-download"></i> تحميل الآن</a>
        </div>
    </div>

    <div style="max-width: 1200px; margin: 30px auto 10px; color: var(--primary); font-weight:bold;">أفلام متشابهة</div>
    <div class="related-grid" id="relatedGrid" style="max-width: 1200px; margin: auto;">
        </div>

    <script>
        const API_KEY = 'b838a848a571a893e6b0effe4bd53db8';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        const type = params.get('type') || 'movie';

        async function getMovieDetails() {
            if(!movieId) return;
            
            try {
                // جلب بيانات الفيلم الأساسية والفيديوهات
                const response = await fetch(`https://api.themoviedb.org/3/${type}/${movieId}?api_key=${API_KEY}&language=ar-AR&append_to_response=videos`);
                const movie = await response.json();

                // تحديث العناصر في الصفحة
                document.getElementById('movieTitle').innerText = movie.title || movie.name;
                document.getElementById('poster').src = IMG_URL + movie.poster_path;
                document.getElementById('movieOverview').innerText = movie.overview || "لا يوجد وصف متاح حالياً باللغة العربية.";
                document.getElementById('imdbRate').innerHTML = `<i class="fa-solid fa-star"></i> IMDb ${movie.vote_average.toFixed(1)}`;
                
                // تحديث جدول التفاصيل
                document.getElementById('detCategory').innerText = type === 'movie' ? 'أفلام' : 'مسلسلات';
                document.getElementById('detGenre').innerText = movie.genres.map(g => g.name).join(' / ');
                document.getElementById('detRuntime').innerText = (movie.runtime || movie.episode_run_time?.[0] || '--') + ' دقيقة';
                document.getElementById('detYear').innerText = (movie.release_date || movie.first_air_date || '').split('-')[0];
                document.getElementById('detLang').innerText = movie.original_language.toUpperCase();
                document.getElementById('detCountry').innerText = movie.production_countries?.[0]?.name || 'غير معروف';

                // البحث عن التريلر
                const trailer = movie.videos.results.find(v => v.type === 'Trailer');
                if(trailer) {
                    document.getElementById('trailerLink').href = `https://www.youtube.com/watch?v=${trailer.key}`;
                }

                getRelated();
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        async function getRelated() {
            const response = await fetch(`https://api.themoviedb.org/3/${type}/${movieId}/recommendations?api_key=${API_KEY}&language=ar-AR`);
            const data = await response.json();
            const grid = document.getElementById('relatedGrid');
            grid.innerHTML = '';
            
            data.results.slice(0, 6).forEach(item => {
                grid.innerHTML += `
                    <div class="related-item">
                        <a href="movie.html?id=${item.id}&type=${type}">
                            <img src="${IMG_URL + item.poster_path}">
                        </a>
                    </div>`;
            });
        }

        getMovieDetails();
    </script>
</body>
</html>
