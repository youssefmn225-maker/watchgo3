<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل العمل - WatchGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #9b51e0; --bg: #050505; --text: #ffffff; --imdb-gold: #f5c518; }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            line-height: 1.6;
            overflow-x: hidden;          /* يمنع السكرول الأفقي تمامًا */
        }

        .movie-layout {
            display: grid;
            grid-template-columns: 300px 1fr 250px;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .poster { 
            width: 100%; 
            border-radius: 12px; 
            border: 2px solid #222; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: block;
        }

        img { max-width: 100%; height: auto; }

        .poster-meta { display: flex; gap: 10px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
        .imdb-badge { background: var(--imdb-gold); color: #000; padding: 5px 12px; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .trailer-btn { background: #222; border: 1px solid #444; padding: 5px 12px; border-radius: 5px; color: #fff; cursor: pointer; font-size: 13px; }

        .info-section h1 { color: var(--primary); margin-top: 0; font-size: 32px; }
        .details-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; margin-top: 20px; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; flex-wrap: wrap; gap: 8px; }
        .row:last-child { border-bottom: none; }
        .row span:first-child { color: var(--primary); font-weight: bold; }

        .action-panel { display: flex; flex-direction: column; gap: 12px; }
        .btn { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn.download { background: #222; border: 1px solid #444; }
        .btn.list-btn { background: #151515; font-size: 13px; padding: 10px; border: 1px solid #333; }

        .cast-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 15px 0; margin-top: 10px; scrollbar-width: thin; }
        .cast-item { min-width: 90px; text-align: center; flex-shrink: 0; }
        .cast-item img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .cast-item div { font-size: 11px; margin-top: 5px; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .seasons-bar { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 10px; }
        .season-btn { background: #1a1a1a; border: 1px solid #444; color: white; padding: 8px 20px; border-radius: 50px; cursor: pointer; transition: 0.3s; white-space: nowrap; flex-shrink: 0; }
        .season-btn.active { background: var(--primary); border-color: var(--primary); }

        .episode-card { background: #111; padding: 15px; border-radius: 15px; border: 1px solid #222; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .episode-card:hover { border-color: var(--primary); background: #1a1a1a; }

        .related-container { margin-top: 30px; }
