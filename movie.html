<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفاصيل الفيلم - WatchGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .poster { width: 100%; border-radius: 15px; border: 2px solid #333; }
        
        .section-title { color: #fff; margin: 20px 0 10px; font-size: 18px; border-right: 4px solid #e74c3c; padding-right: 10px; }
        
        .details-box { background: #121212; padding: 15px; border-radius: 15px; border: 1px solid #333; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .detail-row span:first-child { color: #aaa; }

        .big-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-box { background: #1a1a1a; padding: 20px; border-radius: 15px; text-align: center; text-decoration: none; color: #fff; border: 1px solid #333; }
        .btn-box i { display: block; font-size: 24px; margin-bottom: 10px; color: #e74c3c; }
    </style>
</head>
<body>

    <div class="header-bar">
        <i class="fa-solid fa-arrow-right" onclick="history.back()"></i>
        <span style="font-weight:bold;">TopCinema</span>
        <i class="fa-solid fa-bars"></i>
    </div>

    <img src="" id="moviePoster" class="poster">

    <div class="section-title">قصة الفيلم</div>
    <p style="color: #ccc; font-size: 14px;">هذا الفيلم يستكشف القصص المحلية مع الممثلين والمنتجين بشكل احترافي ومثير...</p>

    <div class="section-title">تفاصيل الفيلم</div>
    <div class="details-box">
        <div class="detail-row"><span>القسم:</span><span>أفلام أجنبي</span></div>
        <div class="detail-row"><span>النوع:</span><span>جريمة - دراما</span></div>
        <div class="detail-row"><span>التقييم:</span><span>⭐ 8.9</span></div>
        <div class="detail-row"><span>الجودة:</span><span>720p WEB-DL</span></div>
    </div>

    <div class="big-btns">
        <a href="#" class="btn-box"><i class="fa-solid fa-download"></i>تحميل الآن</a>
        <a href="#" class="btn-box"><i class="fa-solid fa-clapperboard"></i>مشاهدة الآن</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('moviePoster').src = params.get('poster');
    </script>
</body>
</html>
