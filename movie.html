<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الفيلم - WatchGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #9b51e0; --bg: #050505; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        
        /* تقسيم الصفحة لـ 3 أعمدة (ديسك توب) */
        .movie-layout { display: grid; grid-template-columns: 300px 1fr 250px; gap: 20px; max-width: 1200px; margin: auto; }
        
        /* القسم الأيمن (الصورة) */
        .poster { width: 100%; border-radius: 12px; border: 2px solid #333; }
        
        /* القسم الأوسط (التفاصيل) */
        .info-section h1 { color: var(--primary); margin-top: 0; }
        .details-box { background: #111; padding: 15px; border-radius: 12px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        
        /* القسم الأيسر (الأزرار) */
        .action-panel { display: flex; flex-direction: column; gap: 10px; }
        .btn { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .btn.download { background: #333; }

        /* منطقة التشابهات (شبكة 6 أعمدة) */
        .related-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-top: 30px; }
        .related-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }

        /* استجابة الموبايل: تتحول الصفحة لعمود واحد فوق بعض */
        @media (max-width: 768px) {
            .movie-layout { grid-template-columns: 1fr; }
            .related-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="movie-layout">
        <div class="poster-container">
            <img src="" id="poster" class="poster">
        </div>

        <div class="info-section">
            <h1 id="movieTitle">جاري التحميل...</h1>
            <div class="section-title" style="color: var(--primary); font-weight:bold;">قصة الفيلم</div>
            <p style="color: #ccc;">هنا ستظهر قصة الفيلم بالتفصيل...</p>
            
            <div class="details-box">
                <div class="row"><span>القسم:</span><span id="cat">---</span></div>
                <div class="row"><span>الجودة:</span><span>1080p WEB-DL</span></div>
                <div class="row"><span>موعد الصدور:</span><span>2026</span></div>
            </div>
        </div>

        <div class="action-panel">
            <a href="#" class="btn"><i class="fa-solid fa-play"></i> مشاهدة الآن</a>
            <a href="#" class="btn download"><i class="fa-solid fa-download"></i> تحميل الآن</a>
        </div>
    </div>

    <div class="section-title" style="max-width: 1200px; margin: 30px auto 10px; color: var(--primary);">أفلام متشابهة</div>
    <div class="related-grid" style="max-width: 1200px; margin: auto;">
        <div class="related-item"><img src="https://i.ibb.co/xS9g9zf9/MV5-BNz-Zj-Nj-Rm-ODkt-MDZj-OC00-Mzcw-LWI4-N2-It-YTI5-OWY1-YTI2-ZGZl-Xk-Ey-Xk-Fqc-Gc-449x650.jpg"></div>
        <div class="related-item"><img src="https://i.ibb.co/TqtRdpKX/zf-KS4-WL0-OZ9udp-No-SYZw91-VB3a-H-scaled-433x650.jpg"></div>
        <div class="related-item"><img src="https://i.ibb.co/nqNxs4f7/n-Op-JLL-4f-424x650.jpg"></div>
        <div class="related-item"><img src="https://i.ibb.co/vx3FTWpm/70k-Tz0-Omjj-Ze7z-Hv-IDrq2i-KW7-PJ-scaled-433x650.jpg"></div>
        <div class="related-item"><img src="https://i.ibb.co/S48J73Ys/MV5-BNWU4-Zj-M3-Mj-Qt-ZTAw-MS00-YTY4-LWJh-Ym-Et-ZTFi-MTAx-Nzc4-OGFj-Xk-Ey-Xk-Fqc-Gc-V1-scaled-433x650.jpg"></div>
        <div class="related-item"><img src="https://i.ibb.co/TxbY9Q73/g0j-VBv-4f-464x650.jpg"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('movieTitle').innerText = params.get('title');
        document.getElementById('poster').src = params.get('poster');
        document.getElementById('cat').innerText = params.get('category') || "أفلام";
    </script>
</body>
</html>
