<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - Premium Cinema UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- الأساسيات --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { 
            --primary: #9b51e0; 
            --bg: #050505; 
            --text: #ffffff; 
            --imdb-gold: #f5c518;
            --glass: rgba(255, 255, 255, 0.08);
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            overflow-x: hidden; 
        }

        /* --- الخلفية الكبيرة --- */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center 20%;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,5,0.4), rgba(5,5,5,1));
            z-index: 1;
        }

        /* --- تقسيم الصفحة (Layout) --- */
        .movie-layout { 
            position: relative;
            z-index: 2;
            display: grid; 
            grid-template-columns: 350px 1fr; 
            gap: 40px; 
            width: 95%; /* عشان يملأ الشاشة */
            max-width: 1600px;
            padding: 100px 0;
        }

        /* --- الجانب الأيمن (البوستر) --- */
        .side-panel { display: flex; flex-direction: column; gap: 15px; }
        .poster-wrapper {
            border-radius: 20px; 
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .poster { width: 100%; display: block; border-radius: 18px; }

        .btn {
            padding: 15px; border-radius: 12px; text-align: center;
            font-weight: bold; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: white; text-decoration: none; font-size: 16px;
        }
        .btn-watch { background: var(--primary); }
        .btn-download { background: #222; border: 1px solid #444; }
        .btn-trailer { background: #ff0000; }

        /* --- منطقة البيانات --- */
        .content-panel h1 { font-size: 45px; margin-bottom: 20px; }
        .section-header {
            display: flex; align-items: center; gap: 10px;
            color: var(--primary); font-size: 22px; margin: 30px 0 15px;
            border-right: 4px solid var(--primary); padding-right: 15px;
        }
        .overview { 
            font-size: 18px; line-height: 1.8; color: #ccc; 
            background: var(--glass); padding: 25px; border-radius: 15px;
        }

        /* شبكة التفاصيل */
        .details-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
        }
        .detail-card {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;
            display: flex; justify-content: space-between;
        }
        .detail-card b { color: var(--primary); }

        /* طاقم العمل */
        .cast-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; }
        .cast-item { min-width: 100px; text-align: center; }
        .cast-item img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .cast-item p { font-size: 12px; margin-top: 8px; }

        /* --- الحلقات --- */
        .series-container { margin-top: 40px; }
        .seasons-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .season-tab {
            background: var(--glass); padding: 10px 20px; border-radius: 8px; cursor: pointer;
        }
        .season-tab.active { background: var(--primary); }

        .episodes-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; 
        }
        .episode-card {
            background: var(--glass); border-radius: 15px; overflow: hidden; border: 1px solid #333;
        }
        .episode-img { width: 100%; height: 160px; object-fit: cover; }
        .episode-info { padding: 15px; }
        .ep-num { color: var(--primary); font-weight: bold; }

        /* المتشابهات */
        .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .related-card img { width: 100%; border-radius: 10px; }

        /* الموبايل */
        @media (max-width: 900px) {
            .movie-layout { grid-template-columns: 1fr; padding: 50px 20px; }
            .side-panel { max-width: 300px; margin: 0 auto; }
        }

        #trailerModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; justify-content:center; align-items:center; }
    </style>
</head>
<body>

    <div class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        <div class="movie-layout">
            <div class="side-panel">
                <div class="poster-wrapper"><img src="" id="poster" class="poster"></div>
                <button class="btn btn-watch"><i class="fa-solid fa-play"></i> مشاهدة الآن</button>
                <button class="btn btn-download"><i class="fa-solid fa-download"></i> تحميل</button>
                <button id="openTrailer" class="btn btn-trailer"><i class="fa-brands fa-youtube"></i> التريلر</button>
            </div>

            <div class="content-panel">
                <h1 id="movieTitleEN">Loading...</h1>
                <div class="section-header">قصة العمل</div>
                <p id="movieOverviewAR" class="overview">...</p>

                <div class="section-header">التفاصيل</div>
                <div class="details-grid">
                    <div class="detail-card"><b>القسم:</b><span id="detCategory">--</span></div>
                    <div class="detail-card"><b>النوع:</b><span id="detGenre">--</span></div>
                    <div class="detail-card"><b>السنة:</b><span id="detYear">--</span></div>
                    <div class="detail-card"><b>التقييم:</b><span id="imdbRate">--</span></div>
                </div>

                <div class="section-header">طاقم العمل</div>
                <div id="castContainer" class="cast-scroll"></div>
                
                <div id="seriesSection" class="series-container" style="display: none;">
                    <div class="section-header">المواسم والحلقات</div>
                    <div class="seasons-tabs" id="seasonsTabs"></div>
                    <div class="episodes-grid" id="episodesGrid"></div>
                </div>

                <div class="section-header">أعمال مشابهة</div>
                <div class="related-grid" id="relatedGrid"></div>
            </div>
        </div>
    </div>

    <div id="trailerModal">
        <div style="width:80%; max-width:900px; position:relative;">
            <span id="closeTrailer" style="position:absolute; top:-40px; right:0; color:white; font-size:30px; cursor:pointer;">&times;</span>
            <iframe id="trailerFrame" width="100%" height="500" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_KEY = 'b838a848a571a893e6b0effe4bd53db8';
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        const type = params.get('type') || 'movie';

        async function fetchAll() {
            if(!movieId) return;
            const [resAR, resEN, resRelated] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${movieId}?api_key=${API_KEY}&language=ar-SA`),
                fetch(`https://api.themoviedb.org/3/${type}/${movieId}?api_key=${API_KEY}&language=en-US&append_to_response=credits,videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${movieId}/similar?api_key=${API_KEY}&language=ar-SA`)
            ]);
            const dAR = await resAR.json();
            const dEN = await resEN.json();
            const dRel = await resRelated.json();

            document.getElementById('movieTitleEN').innerText = dEN.title || dEN.name;
            document.getElementById('movieOverviewAR').innerText = dAR.overview || "قريباً..";
            document.getElementById('poster').src = 'https://image.tmdb.org/t/p/w500' + dEN.poster_path;
            document.getElementById('heroSection').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${dEN.backdrop_path})`;
            
            document.getElementById('detCategory').innerText = type === 'movie' ? 'أفلام' : 'مسلسلات';
            document.getElementById('detGenre').innerText = dAR.genres?.[0]?.name || '--';
            document.getElementById('detYear').innerText = (dEN.release_date || dEN.first_air_date || '').split('-')[0];
            document.getElementById('imdbRate').innerText = dEN.vote_average?.toFixed(1);

            const castCont = document.getElementById('castContainer');
            dEN.credits.cast.slice(0, 10).forEach(c => {
                if(c.profile_path) castCont.innerHTML += `<div class="cast-item"><img src="https://image.tmdb.org/t/p/w200${c.profile_path}"><p>${c.name}</p></div>`;
            });

            const relGrid = document.getElementById('relatedGrid');
            dRel.results.slice(0, 6).forEach(item => {
                relGrid.innerHTML += `<a href="?id=${item.id}&type=${type}" class="related-card"><img src="https://image.tmdb.org/t/p/w300${item.poster_path}"></a>`;
            });

            const trailer = dEN.videos.results.find(v => v.type === 'Trailer');
            if(trailer) {
                document.getElementById('openTrailer').onclick = () => {
                    document.getElementById('trailerFrame').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
                    document.getElementById('trailerModal').style.display = 'flex';
                };
            }

            if(type === 'tv') {
                document.getElementById('seriesSection').style.display = 'block';
                setupSeasons(dEN.seasons);
            }
        }

        function setupSeasons(seasons) {
            const tabs = document.getElementById('seasonsTabs');
            const valid = seasons.filter(s => s.season_number > 0);
            valid.forEach((s, i) => {
                const btn = document.createElement('div');
                btn.className = `season-tab ${i === 0 ? 'active' : ''}`;
                btn.innerText = `الموسم ${s.season_number}`;
                btn.onclick = () => {
                    document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    loadEpisodes(s.season_number);
                };
                tabs.appendChild(btn);
            });
            loadEpisodes(valid[0].season_number);
        }

        async function loadEpisodes(num) {
            const grid = document.getElementById('episodesGrid');
            grid.innerHTML = 'جاري التحميل...';
            const res = await fetch(`https://api.themoviedb.org/3/tv/${movieId}/season/${num}?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            grid.innerHTML = '';
            data.episodes.forEach(ep => {
                const img = ep.still_path ? `https://image.tmdb.org/t/p/w500${ep.still_path}` : 'https://via.placeholder.com/300x160';
                grid.innerHTML += `
                    <div class="episode-card">
                        <img src="${img}" class="episode-img">
                        <div class="episode-info">
                            <span class="ep-num">الحلقة ${ep.episode_number}</span>
                            <div class="ep-title">${ep.name}</div>
                        </div>
                    </div>`;
            });
        }

        document.getElementById('closeTrailer').onclick = () => {
            document.getElementById('trailerModal').style.display = 'none';
            document.getElementById('trailerFrame').src = '';
        };

        fetchAll();
    </script>
</body>
</html>
