<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - Movie Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* الحفاظ على نفس التنسيقات اللي ظبطت الواجهة عندك */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root { --primary: #9b51e0; --bg: #050505; --text: #ffffff; --imdb-gold: #f5c518; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
            line-height: 1.4;
        }

        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            padding: 40px 5%;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.85) 60%, rgba(5,5,5,1) 100%);
            z-index: 1;
        }

        .movie-layout { 
            position: relative;
            z-index: 2;
            display: grid; 
            grid-template-columns: 280px 1fr 250px; 
            gap: 30px; 
            width: 100%;
            max-width: 1400px;
            align-items: start;
        }

        .poster-container { text-align: center; }
        .poster { 
            width: 100%; 
            border-radius: 12px; 
            border: 2px solid var(--primary); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
        }

        .poster-meta { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }
        .imdb-badge { background: var(--imdb-gold); color: #000; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; }

        .info-section h1 { font-size: 38px; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        .label-title { color: var(--primary); font-weight: bold; margin-bottom: 5px; font-size: 16px; display: block; }
        .overview { color: #ddd; font-size: 15px; margin-bottom: 20px; max-width: 900px; }

        .cast-scroll { 
            display: flex; 
            gap: 12px; 
            overflow-x: auto; 
            padding-bottom: 10px; 
            scrollbar-width: none; 
        }
        .cast-item { min-width: 80px; text-align: center; }
        .cast-item img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .cast-item div { font-size: 11px; margin-top: 5px; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .details-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .detail-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0; }
        .detail-item:last-child { border: none; }
        .detail-item span:first-child { color: var(--primary); font-weight: bold; }

        .action-panel { display: flex; flex-direction: column; gap: 12px; }
        .btn { 
            background: var(--primary); color: white; padding: 14px; text-align: center; 
            border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; 
            border: none; cursor: pointer; font-size: 15px;
        }
        .btn.secondary { background: rgba(255,255,255,0.1); border: 1px solid #444; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        /* تظبيط الموبايل مع مراعاة طلبك بعدم تغيير واجهة اللاب */
        @media (max-width: 1024px) {
            .movie-layout { grid-template-columns: 250px 1fr; }
        }

        @media (max-width: 768px) {
            .hero-section { padding: 20px; }
            .movie-layout { display: flex; flex-direction: column; align-items: center; text-align: center; }
            .info-section h1 { font-size: 28px; }
            .details-grid { width: 100%; }
            .cast-scroll { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        
        <div class="movie-layout">
            <div class="poster-container">
                <img src="" id="poster" class="poster">
                <div class="poster-meta">
                    <div class="imdb-badge" id="imdbRate"><i class="fa-solid fa-star"></i> --</div>
                    <div style="font-weight: bold;" id="detYear">----</div>
                </div>
                <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px;">
                    <button class="btn secondary" style="font-size: 13px;"><i class="fa-solid fa-heart"></i> Add to Favorites</button>
                    <button class="btn secondary" style="font-size: 13px;"><i class="fa-solid fa-clock"></i> Watch Later</button>
                </div>
            </div>

            <div class="info-section">
                <h1 id="movieTitle">Loading...</h1>
                
                <span class="label-title">Synopsis</span>
                <p id="movieOverview" class="overview">...</p>
                
                <span class="label-title">Cast</span>
                <div id="castContainer" class="cast-scroll"></div>

                <div class="details-grid">
                    <div class="detail-item"><span>Category</span><span id="detCategory">---</span></div>
                    <div class="detail-item"><span>Genre</span><span id="detGenre">---</span></div>
                    <div class="detail-item"><span>Runtime</span><span id="detRuntime">-- min</span></div>
                    <div class="detail-item"><span>Language</span><span id="detLang">--</span></div>
                </div>
            </div>

            <div class="action-panel">
                <button class="btn"><i class="fa-solid fa-play"></i> Watch Now</button>
                <button class="btn secondary"><i class="fa-solid fa-download"></i> Download</button>
                <button id="trailerLink" class="btn secondary" style="color: #ff4d4d; border-color: #ff4d4d;"><i class="fa-brands fa-youtube"></i> Trailer</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'b838a848a571a893e6b0effe4bd53db8';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BG_URL = 'https://image.tmdb.org/t/p/original';
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        const type = params.get('type') || 'movie';

        async function fetchDetails() {
            if(!movieId) return;
            // تم تغيير اللغة هنا إلى الإنجليزية en-US
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${movieId}?api_key=${API_KEY}&language=en-US&append_to_response=credits,videos`);
            const data = await res.json();

            document.getElementById('movieTitle').innerText = data.title || data.name;
            document.getElementById('movieOverview').innerText = data.overview || "No synopsis available.";
            document.getElementById('poster').src = IMG_URL + data.poster_path;
            document.getElementById('heroSection').style.backgroundImage = `url(${BG_URL + data.backdrop_path})`;
            document.getElementById('imdbRate').innerHTML = `<i class="fa-solid fa-star"></i> ${data.vote_average.toFixed(1)}`;
            document.getElementById('detYear').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('detCategory').innerText = type === 'movie' ? 'Movies' : 'TV Series';
            document.getElementById('detGenre').innerText = data.genres.slice(0, 2).map(g => g.name).join(' / ');
            document.getElementById('detRuntime').innerText = (data.runtime || (data.episode_run_time ? data.episode_run_time[0] : '--')) + ' min';
            document.getElementById('detLang').innerText = data.original_language.toUpperCase();

            const castCont = document.getElementById('castContainer');
            data.credits.cast.slice(0, 8).forEach(c => {
                if(c.profile_path) {
                    castCont.innerHTML += `<div class="cast-item"><img src="${IMG_URL + c.profile_path}"><div>${c.name}</div></div>`;
                }
            });
        }
        fetchDetails();
    </script>
</body>
</html>
