<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - Ultimate Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- الأساسيات والألوان --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { 
            --primary: #9b51e0; 
            --bg: #050505; 
            --text: #ffffff; 
            --imdb-gold: #f5c518;
            --glass: rgba(255, 255, 255, 0.05);
            --shadow-purple: rgba(155, 81, 224, 0.3);
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            overflow-x: hidden; 
            line-height: 1.6;
        }

        /* --- أنميشن --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 5px var(--primary); }
            50% { box-shadow: 0 0 20px var(--primary); }
            100% { box-shadow: 0 0 5px var(--primary); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- الخلفية السينمائية --- */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center 20%;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 5%;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, 
                rgba(5,5,5,0.3) 0%, 
                rgba(5,5,5,0.8) 50%, 
                rgba(5,5,5,1) 100%);
            z-index: 1;
        }

        /* --- تقسيم الواجهة --- */
        .movie-layout { 
            position: relative;
            z-index: 2;
            display: grid; 
            grid-template-columns: 320px 1fr; 
            gap: 50px; 
            width: 100%;
            max-width: 1450px;
            animation: fadeInUp 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* --- الجانب الأيمن (البوستر والأكشن) --- */
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        .poster-wrapper {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transition: 0.5s;
        }
        .poster-wrapper:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--shadow-purple); }
        .poster { width: 100%; display: block; }

        .btn {
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 16px;
            transition: 0.4s;
            color: white;
            text-decoration: none;
        }
        .btn-watch { background: var(--primary); animation: glowPulse 3s infinite; }
        .btn-download { background: rgba(40, 40, 40, 0.8); border: 1px solid #444; backdrop-filter: blur(5px); }
        .btn-trailer { background: #ff0000; }

        /* --- منطقة المعلومات --- */
        .content-panel h1 { 
            font-size: 50px; 
            margin-bottom: 20px; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-size: 22px;
            margin: 35px 0 15px;
            font-weight: bold;
            border-right: 4px solid var(--primary);
            padding-right: 15px;
        }

        .overview { 
            font-size: 18px; 
            line-height: 2; 
            color: #eee; 
            background: rgba(255,255,255,0.04);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        /* شبكة التفاصيل */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        .detail-card {
            background: var(--glass);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }
        .detail-card b { color: var(--primary); display: flex; align-items: center; gap: 10px; }

        /* طاقم العمل */
        .cast-scroll { display: flex; gap: 20px; overflow-x: auto; padding: 15px 5px; scrollbar-width: none; }
        .cast-item { min-width: 100px; text-align: center; }
        .cast-item img { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .cast-item p { font-size: 13px; margin-top: 10px; color: #bbb; }

        /* --- نظام الحلقات الجديد (الدوائر وتوسيع الشاشة) --- */
        .series-container { margin-top: 50px; width: 100%; animation: fadeInUp 1s; }
        .seasons-tabs { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .season-tab {
            background: var(--glass); padding: 12px 25px; border-radius: 10px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1); transition: 0.4s; font-weight: bold;
        }
        .season-tab.active { background: var(--primary); border-color: var(--primary); }

        /* شبكة الحلقات - معدلة لتبدأ من اليمين وتملأ الشاشة */
        .episodes-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 20px; 
            margin-top: 25px; 
            width: 100%; /* تملأ الشاشة بالعرض */
            justify-content: start; /* محاذاة لليمين */
        }

        /* تصميم زر الحلقة الدائري */
        .episode-circle-btn {
            background: linear-gradient(135deg, var(--primary), #7a3eb1);
            color: white;
            width: 90px;
            height: 90px;
            border-radius: 50%; /* دائرة كاملة */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.1);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            text-decoration: none;
        }

        .episode-circle-btn:hover {
            transform: scale(1.15) rotate(5deg);
            border-color: #fff;
            box-shadow: 0 0 25px var(--primary);
        }

        .ep-label { font-size: 11px; opacity: 0.8; margin-bottom: 2px; }
        .ep-num-big { font-size: 22px; font-weight: 800; }

        /* --- المتشابهات --- */
        .related-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-top: 25px; }
        .related-card { border-radius: 10px; overflow: hidden; transition: 0.4s; border: 1px solid #222; }
        .related-card:hover { transform: scale(1.1); border-color: var(--primary); }
        .related-card img { width: 100%; height: 100%; object-fit: cover; }

        /* Modal */
        #trailerModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:99999; justify-content:center; align-items:center; }
        
        @media (max-width: 1100px) {
            .movie-layout { grid-template-columns: 1fr; justify-items: center; text-align: center; }
            .episodes-grid { justify-content: center; } /* توسيط في الموبايل */
        }
    </style>
</head>
<body>

    <div class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        
        <div class="movie-layout">
            <div class="side-panel">
                <div class="poster-wrapper">
                    <img src="" id="poster" class="poster">
                </div>
                <button class="btn btn-watch"><i class="fa-solid fa-play"></i> مـشـاهـدة الآن</button>
                <button class="btn btn-download"><i class="fa-solid fa-download"></i> تـحـمـيـل الـعـمـل</button>
                <button id="openTrailer" class="btn btn-trailer"><i class="fa-brands fa-youtube"></i> الإعـلان الـرسـمـي</button>
            </div>

            <div class="content-panel">
                <h1 id="movieTitleEN">Loading...</h1>
                
                <div class="section-header"><i class="fa-solid fa-align-right"></i> قـصـة الـفـيـلـم</div>
                <p id="movieOverviewAR" class="overview">...</p>

                <div class="section-header"><i class="fa-solid fa-circle-info"></i> تـفـاصـيـل الـعـمـل</div>
                <div class="details-grid">
                    <div class="detail-card"><b><i class="fa-solid fa-folder"></i> الـقـسـم:</b><span id="detCategory">--</span></div>
                    <div class="detail-card"><b><i class="fa-solid fa-masks-theater"></i> الـنـوع:</b><span id="detGenre">--</span></div>
                    <div class="detail-card"><b><i class="fa-solid fa-clock"></i> الـمـدة:</b><span id="detRuntime">--</span></div>
                    <div class="detail-card"><b><i class="fa-solid fa-calendar-star"></i> الـسـنـة:</b><span id="detYear">--</span></div>
                    <div class="detail-card"><b><i class="fa-solid fa-star" style="color:var(--imdb-gold)"></i> الـتـقـيـيـم:</b><span id="imdbRate">--</span></div>
                    <div class="detail-card"><b><i class="fa-solid fa-language"></i> الـلـغـة:</b><span id="detLang">--</span></div>
                </div>

                <div class="section-header"><i class="fa-solid fa-users-viewfinder"></i> طـاقـم الـعـمـل</div>
                <div id="castContainer" class="cast-scroll"></div>
                
                <div id="seriesSection" class="series-container" style="display: none;">
                    <div class="section-header"><i class="fa-solid fa-tv"></i> الـمـواسـم والـحـلـقـات</div>
                    <div class="seasons-tabs" id="seasonsTabs"></div>
                    <div class="episodes-grid" id="episodesGrid"></div>
                </div>

                <div class="section-header"><i class="fa-solid fa-wand-magic-sparkles"></i> أعـمـال مـشـابـهـة</div>
                <div class="related-grid" id="relatedGrid"></div>
            </div>
        </div>
    </div>

    <div id="trailerModal">
        <div style="position:relative; width:85%; max-width:1000px;">
            <span id="closeTrailer" style="position:absolute; top:-45px; right:0; color:white; font-size:35px; cursor:pointer;"><i class="fa-solid fa-circle-xmark"></i></span>
            <iframe id="trailerFrame" width="100%" height="550" src="" frameborder="0" allowfullscreen style="border-radius:15px; border:3px solid var(--primary);"></iframe>
        </div>
    </div>

    <script>
        const API_KEY = 'b838a848a571a893e6b0effe4bd53db8';
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        const type = params.get('type') || 'movie';

        async function fetchAll() {
            if(!movieId) return;

            const [resAR, resEN, resRelated] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${movieId}?api_key=${API_KEY}&language=ar-SA`),
                fetch(`https://api.themoviedb.org/3/${type}/${movieId}?api_key=${API_KEY}&language=en-US&append_to_response=credits,videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${movieId}/similar?api_key=${API_KEY}&language=ar-SA`)
            ]);

            const dAR = await resAR.json();
            const dEN = await resEN.json();
            const dRel = await resRelated.json();

            document.getElementById('movieTitleEN').innerText = dEN.title || dEN.name;
            document.getElementById('movieOverviewAR').innerText = dAR.overview || "قريباً..";
            document.getElementById('poster').src = 'https://image.tmdb.org/t/p/w500' + dEN.poster_path;
            document.getElementById('heroSection').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${dEN.backdrop_path})`;
            
            document.getElementById('detCategory').innerText = type === 'movie' ? 'أفلام' : 'مسلسلات';
            document.getElementById('detGenre').innerText = dAR.genres.slice(0, 2).map(g => g.name).join(' / ');
            document.getElementById('detRuntime').innerText = (dEN.runtime || dEN.episode_run_time?.[0] || '--') + ' دقيقة';
            document.getElementById('detYear').innerText = (dEN.release_date || dEN.first_air_date || '').split('-')[0];
            document.getElementById('imdbRate').innerText = dEN.vote_average.toFixed(1) + ' / 10';
            document.getElementById('detLang').innerText = dEN.original_language.toUpperCase();

            const castCont = document.getElementById('castContainer');
            dEN.credits.cast.slice(0, 12).forEach(c => {
                if(c.profile_path) {
                    castCont.innerHTML += `<div class="cast-item"><img src="https://image.tmdb.org/t/p/w200${c.profile_path}"><p>${c.name}</p></div>`;
                }
            });

            const relGrid = document.getElementById('relatedGrid');
            dRel.results.slice(0, 6).forEach(item => {
                if(item.poster_path) {
                    relGrid.innerHTML += `<a href="movie.html?id=${item.id}&type=${type}" class="related-card"><img src="https://image.tmdb.org/t/p/w300${item.poster_path}"></a>`;
                }
            });

            const trailer = dEN.videos.results.find(v => v.type === 'Trailer');
            if(trailer) {
                document.getElementById('openTrailer').onclick = () => {
                    document.getElementById('trailerFrame').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
                    document.getElementById('trailerModal').style.display = 'flex';
                };
            } else { document.getElementById('openTrailer').style.display = 'none'; }

            if(type === 'tv') {
                document.getElementById('seriesSection').style.display = 'block';
                setupSeasons(dEN.seasons);
            }
        }

        function setupSeasons(seasons) {
            const tabs = document.getElementById('seasonsTabs');
            seasons.forEach((s, i) => {
                if(s.season_number === 0) return;
                const btn = document.createElement('div');
                btn.className = `season-tab ${i === (seasons[0].season_number === 0 ? 1 : 0) ? 'active' : ''}`;
                btn.innerText = `الموسم ${s.season_number}`;
                btn.onclick = () => {
                    document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    loadEpisodes(s.season_number);
                };
                tabs.appendChild(btn);
            });
            loadEpisodes(seasons[seasons[0].season_number === 0 ? 1 : 0].season_number);
        }

        async function loadEpisodes(num) {
            const grid = document.getElementById('episodesGrid');
            grid.innerHTML = '<div style="color:var(--primary)">جاري سحب الحلقات...</div>';
            const res = await fetch(`https://api.themoviedb.org/3/tv/${movieId}/season/${num}?api_key=${API_KEY}&language=ar-SA`);
            const data = await res.json();
            grid.innerHTML = '';
            data.episodes.forEach(ep => {
                grid.innerHTML += `
                    <div class="episode-circle-btn" style="animation: slideInRight 0.4s ease forwards">
                        <span class="ep-label">حلقة</span>
                        <span class="ep-num-big">${ep.episode_number}</span>
                    </div>`;
            });
        }

        document.getElementById('closeTrailer').onclick = () => {
            document.getElementById('trailerModal').style.display = 'none';
            document.getElementById('trailerFrame').src = '';
        };

        fetchAll();
    </script>
</body>
</html>
