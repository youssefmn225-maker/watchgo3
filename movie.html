<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل العمل - WatchGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #9b51e0; --bg: #050505; --text: #ffffff; --imdb-gold: #f5c518; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            overflow-x: hidden; 
        }

        /* الخلفية السينمائية اللي طلبت متتغيرش */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center 20%;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            padding: 50px 5%;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,5,0.5) 0%, rgba(5,5,5,0.9) 70%, rgba(5,5,5,1) 100%);
            z-index: 1;
        }

        .movie-layout { 
            position: relative;
            z-index: 2;
            display: grid; 
            grid-template-columns: 300px 1fr; 
            gap: 40px; 
            width: 100%;
            max-width: 1400px;
        }

        /* تنسيق البوستر والزراير الجانبية */
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        .poster { 
            width: 100%; 
            border-radius: 10px; 
            border: 2px solid var(--primary); 
            box-shadow: 0 0 30px rgba(155, 81, 224, 0.3);
        }

        .main-btn {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            transition: 0.3s;
        }
        .main-btn.watch { background: #e91e63; } /* لون مميز للمشاهدة زي الصور */
        .main-btn.download { background: #2196f3; } /* لون مميز للتحميل */
        .main-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* منطقة المعلومات */
        .content-panel h1 { 
            font-size: 45px; 
            margin-bottom: 20px; 
            color: var(--text); 
            font-family: 'Arial', sans-serif; /* عشان الاسم الإنجليزي يبقى واضح */
            text-align: right; 
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            font-size: 20px;
            margin: 25px 0 10px;
            font-weight: bold;
        }
        .section-title i { font-size: 24px; }

        .overview { 
            font-size: 17px; 
            line-height: 1.8; 
            color: #ccc; 
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid var(--primary);
        }

        /* شبكة التفاصيل زي المواقع الاحترافية */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .detail-card {
            background: rgba(20, 20, 20, 0.6);
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .detail-card span:first-child { color: var(--primary); font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .detail-card span:last-child { color: #fff; font-size: 14px; }

        /* طاقم العمل */
        .cast-row { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .cast-box { min-width: 90px; text-align: center; }
        .cast-box img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        .cast-box div { font-size: 12px; margin-top: 5px; color: #bbb; }

        @media (max-width: 900px) {
            .movie-layout { grid-template-columns: 1fr; }
            .content-panel h1 { font-size: 30px; text-align: center; }
            .side-panel { align-items: center; }
            .poster { max-width: 250px; }
            .details-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        
        <div class="movie-layout">
            <div class="side-panel">
                <img src="" id="poster" class="poster">
                <button class="main-btn watch"><i class="fa-solid fa-play"></i> مشاهدة الآن</button>
                <button class="main-btn download"><i class="fa-solid fa-download"></i> تحميل الآن</button>
                <div style="display: flex; gap: 10px;">
                    <button class="main-btn" style="flex:1; background:#333;"><i class="fa-solid fa-heart"></i></button>
                    <button class="main-btn" style="flex:1; background:#333;"><i class="fa-solid fa-share"></i></button>
                </div>
            </div>

            <div class="content-panel">
                <h1 id="movieTitleEN">Movie Title</h1> <div class="section-title"><i class="fa-solid fa-quote-right"></i> قصة الفيلم</div>
                <p id="movieOverviewAR" class="overview">...</p> <div class="section-title"><i class="fa-solid fa-circle-info"></i> تفاصيل الفيلم</div>
                <div class="details-grid">
                    <div class="detail-card">
                        <span><i class="fa-solid fa-layer-group"></i> القسم:</span>
                        <span id="detCategory">أفلام</span>
                    </div>
                    <div class="detail-card">
                        <span><i class="fa-solid fa-masks-theater"></i> النوع:</span>
                        <span id="detGenre">---</span>
                    </div>
                    <div class="detail-card">
                        <span><i class="fa-solid fa-clock"></i> التوقيت:</span>
                        <span id="detRuntime">-- دقيقة</span>
                    </div>
                    <div class="detail-card">
                        <span><i class="fa-solid fa-calendar-days"></i> موعد الصدور:</span>
                        <span id="detYear">----</span>
                    </div>
                    <div class="detail-card">
                        <span><i class="fa-solid fa-star" style="color:var(--imdb-gold)"></i> التقييم:</span>
                        <span id="imdbRate">-- / 10</span>
                    </div>
                    <div class="detail-card">
                        <span><i class="fa-solid fa-language"></i> اللغة الأصلية:</span>
                        <span id="detLang">--</span>
                    </div>
                </div>

                <div class="section-title"><i class="fa-solid fa-users"></i> طاقم العمل</div>
                <div id="castContainer" class="cast-row"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'b838a848a571a893e6b0effe4bd53db8';
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        const type = params.get('type') || 'movie';

        async function fetchAllData() {
            if(!movieId) return;

            // سحب البيانات بالعربي للوصف
            const resAR = await fetch(`https://api.themoviedb.org/3/${type}/${movieId}?api_key=${API_KEY}&language=ar-SA`);
            const dataAR = await resAR.json();

            // سحب البيانات بالإنجليزي للعنوان والبوستر
            const resEN = await fetch(`https://api.themoviedb.org/3/${type}/${movieId}?api_key=${API_KEY}&language=en-US&append_to_response=credits`);
            const dataEN = await resEN.json();

            // تطبيق البيانات
            document.getElementById('movieTitleEN').innerText = dataEN.title || dataEN.name;
            document.getElementById('movieOverviewAR').innerText = dataAR.overview || "لا يوجد وصف متاح حالياً.";
            document.getElementById('poster').src = 'https://image.tmdb.org/t/p/w500' + dataEN.poster_path;
            document.getElementById('heroSection').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${dataEN.backdrop_path})`;
            
            // التفاصيل بالعربي
            document.getElementById('detCategory').innerText = type === 'movie' ? 'أفلام أجنبي' : 'مسلسلات أجنبي';
            document.getElementById('detGenre').innerText = dataAR.genres.map(g => g.name).join(' / ');
            document.getElementById('detRuntime').innerText = (dataEN.runtime || dataEN.episode_run_time?.[0] || '--') + ' دقيقة';
            document.getElementById('detYear').innerText = (dataEN.release_date || dataEN.first_air_date || '').split('-')[0];
            document.getElementById('imdbRate').innerText = dataEN.vote_average.toFixed(1) + ' / 10';
            document.getElementById('detLang').innerText = dataEN.original_language.toUpperCase();

            // طاقم العمل
            const castCont = document.getElementById('castContainer');
            dataEN.credits.cast.slice(0, 10).forEach(c => {
                if(c.profile_path) {
                    castCont.innerHTML += `
                        <div class="cast-box">
                            <img src="https://image.tmdb.org/t/p/w200${c.profile_path}">
                            <div>${c.name}</div>
                        </div>`;
                }
            });
        }

        fetchAllData();
    </script>
</body>
</html>
