<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - مشاهدة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #9b51e0; --bg: #050505; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; }
        
        .poster { width: 100%; border-radius: 12px; margin-bottom: 20px; }
        .section-title { color: var(--primary); font-size: 18px; font-weight: bold; margin: 15px 0; border-right: 4px solid var(--primary); padding-right: 10px; }
        
        .details-list { background: #111; padding: 15px; border-radius: 12px; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .row span:first-child { color: #888; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { background: #1a1a1a; padding: 15px; text-align: center; border-radius: 12px; text-decoration: none; color: white; border: 1px solid #333; }
        .btn i { display: block; margin-bottom: 5px; color: var(--primary); }
    </style>
</head>
<body>

    <img src="" id="poster" class="poster">

    <div class="section-title">قصة الفيلم</div>
    <p style="color: #ccc; font-size: 14px;">هنا هتكون قصة الفيلم اللي هنضيفها في المصفوفة قريباً...</p>

    <div class="section-title">تفاصيل الفيلم</div>
    <div class="details-list">
        <div class="row"><span>التصنيف:</span><span id="cat">---</span></div>
        <div class="row"><span>التقييم:</span><span>⭐ 8.5</span></div>
        <div class="row"><span>الجودة:</span><span>720p</span></div>
    </div>

    <div class="action-btns">
        <a href="#" class="btn"><i class="fa-solid fa-download"></i>تحميل</a>
        <a href="#" class="btn"><i class="fa-solid fa-play"></i>مشاهدة</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('poster').src = params.get('poster');
        document.getElementById('cat').innerText = "أفلام"; // ممكن نبعتها من الرابط برضه
    </script>
</body>
</html>
