<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - تجربة سينمائية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #9b51e0; /* البنفسجي */
            --bg: #050505;
            --card-bg: #121212;
            --text: #ffffff;
            --accent: #ff0055; /* الوردي للتميز */
        }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* الهيدر الأنيق */
        .header { background: rgba(10, 10, 10, 0.95); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); backdrop-filter: blur(10px); }
        .logo-box { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 20px; }
        .logo-box img { width: 40px; border-radius: 50%; border: 2px solid var(--primary); }

        /* الأزرار العصرية */
        .btn-style {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            text-align: center;
            font-weight: bold;
        }
        .btn-style:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--primary); }

        /* القائمة الجانبية المحدثة */
        .side-nav { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background: #111; overflow-x: hidden; transition: 0.4s; padding-top: 60px; border-right: 2px solid var(--primary); }
        .side-nav a { padding: 15px 25px; text-decoration: none; color: white; display: block; font-size: 16px; border-bottom: 1px solid #222; }
        .sub-menu { display: none; background: #1a1a1a; padding-right: 20px; }
        
        .movies-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; }
        .movie-card { background: var(--card-bg); border-radius: 15px; padding: 10px; text-align: center; border: 1px solid #333; }
        .movie-card img { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-box">
            <img src="https://i.ibb.co/5ggRsXdV/Red-Black-Modern-Movie-Cinema-Presentation-20260311-124846.jpg" alt="Logo">
            WATCHGO
        </div>
        <i class="fa-solid fa-bars" style="font-size: 24px; cursor: pointer;" onclick="openNav()"></i>
    </header>

    <div id="mySideNav" class="side-nav">
        <a href="javascript:void(0)" onclick="closeNav()">&times; إغلاق</a>
        <a href="#">الرئيسية</a>
        
        <a href="#" onclick="toggleMenu('moviesMenu')">أفلام أجنبي ▾</a>
        <div id="moviesMenu" class="sub-menu">
            <a href="#">الأعلى تقييماً IMDB ⭐</a>
            <a href="#">أكشن</a>
            <a href="#">غموض</a>
        </div>

        <a href="#" onclick="toggleMenu('seriesMenu')">مسلسلات أجنبي ▾</a>
        <div id="seriesMenu" class="sub-menu">
            <a href="#">الأعلى تقييماً IMDB ⭐</a>
            <a href="#">دراما</a>
            <a href="#">جريمة</a>
        </div>
    </div>

    <div class="movies-grid" id="movies-container">
        <div class="movie-card">
            <img src="https://i.ibb.co/xS9g9zf9/MV5-BNz-Zj-Nj-Rm-ODkt-MDZj-OC00-Mzcw-LWI4-N2-It-YTI5-OWY1-YTI2-ZGZl-Xk-Ey-Xk-Fqc-Gc-449x650.jpg">
            <p>CIA</p>
            <a href="#" class="btn-style">شاهد الآن</a>
        </div>
    </div>

    <script>
        function openNav() { document.getElementById("mySideNav").style.width = "250px"; }
        function closeNav() { document.getElementById("mySideNav").style.width = "0"; }
        function toggleMenu(id) {
            let el = document.getElementById(id);
            el.style.display = (el.style.display === "block") ? "none" : "block";
        }
    </script>
</body>
</html>
