<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - عالم السينما</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; margin: 0; }
        .header { background: #111; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #800080; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; color: #fff; display: flex; align-items: center; }
        .logo img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #800080; object-fit: cover; margin-left: 10px; }
        .header-icons { display: flex; align-items: center; gap: 15px; }
        .icon-btn { font-size: 24px; cursor: pointer; color: #fff; }
        #searchBox { display: none; padding: 15px; background: #1a1a1a; border-bottom: 2px solid #800080; }
        #searchBox input { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #000; color: #fff; outline: none; text-align: center; }
        .side-nav { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #111; overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-right: 2px solid #800080; }
        .side-nav a { padding: 15px 25px; text-decoration: none; font-size: 16px; color: #fff; display: block; border-bottom: 1px solid #222; cursor: pointer; }
        .sub-menu { display: none; background: #1a1a1a; padding-right: 20px; }
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; }
        .movies-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .movie-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .movie-card img { width: 100%; height: 230px; object-fit: cover; }
        .movie-title { padding: 8px; font-size: 13px; text-align: center; color: #fff; }
        .watch-btn { display: block; background: #800080; color: #fff; text-align: center; padding: 10px; text-decoration: none; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="https://i.ibb.co/5ggRsXdV/Red-Black-Modern-Movie-Cinema-Presentation-20260311-124846.jpg" alt="Logo">
            WATCHGO
        </div>
        <div class="header-icons">
            <i class="fa-solid fa-magnifying-glass icon-btn" onclick="toggleSearch()"></i>
            <div class="icon-btn" onclick="openNav()">☰</div>
        </div>
    </header>

    <div id="searchBox">
        <input type="text" id="searchInput" placeholder="ابحث..." onkeyup="filterMovies()">
    </div>

    <div id="mySideNav" class="side-nav">
        <a href="javascript:void(0)" class="close-btn" onclick="closeNav()">&times;</a>
        <a href="#" onclick="filterMovies('الكل')">🏠 الرئيسية</a>
        
        <a href="#" onclick="toggleSub('subMovies')">🎬 أفلام أجنبي ▾</a>
        <div id="subMovies" class="sub-menu">
            <a href="#" onclick="filterMovies('إسباني')">🇪🇸 إسباني</a>
            <a href="#" onclick="filterMovies('أمريكي')">🇺🇸 أمريكي</a>
            <a href="#" onclick="filterMovies('فرنسي')">🇫🇷 فرنسي</a>
            <a href="#" onclick="filterMovies('تركي')">🇹🇷 تركي</a>
        </div>
        <a href="#" onclick="toggleSub('subMoviesAr')">🎭 أفلام عربي ▾</a>
        <div id="subMoviesAr" class="sub-menu">
            <a href="#" onclick="filterMovies('مصرية')">🇪🇬 مصرية</a>
            <a href="#" onclick="filterMovies('خليجية')">🇸🇦 خليجية</a>
        </div>

        <a href="#" onclick="toggleSub('subSeries')">📺 مسلسلات أجنبي ▾</a>
        <div id="subSeries" class="sub-menu">
            <a href="#" onclick="filterMovies('إسباني-م')">🇪🇸 إسباني</a>
            <a href="#" onclick="filterMovies('أمريكي-م')">🇺🇸 أمريكي</a>
            <a href="#" onclick="filterMovies('فرنسي-م')">🇫🇷 فرنسي</a>
            <a href="#" onclick="filterMovies('تركي-م')">🇹🇷 تركي</a>
        </div>
        <a href="#" onclick="toggleSub('subSeriesAr')">📱 مسلسلات عربي ▾</a>
        <div id="subSeriesAr" class="sub-menu">
            <a href="#" onclick="filterMovies('مصرية-م')">🇪🇬 مصرية</a>
            <a href="#" onclick="filterMovies('خليجية-م')">🇸🇦 خليجية</a>
        </div>
        
        <a href="#" onclick="filterMovies('أنمي')">🏮 أنمي</a>
        <a href="#" onclick="filterMovies('أنميشن')">🧸 أنميشن</a>
    </div>

    <div class="movies-container" id="movies-grid"></div>

    <script>
        function openNav() { document.getElementById("mySideNav").style.width = "250px"; }
        function closeNav() { document.getElementById("mySideNav").style.width = "0"; }
        function toggleSub(id) { 
            const el = document.getElementById(id);
            el.style.display = (el.style.display === "block") ? "none" : "block"; 
        }
        function toggleSearch() { document.getElementById("searchBox").style.display = (document.getElementById("searchBox").style.display === "block") ? "none" : "block"; }

        const movies = [
            { title: "Money Heist", category: "إسباني", poster: "https://i.ibb.co/TqtRdpKX/zf-KS4-WL0-OZ9udp-No-SYZw91-VB3a-H-scaled-433x650.jpg" },
            { title: "فيلم مصري", category: "مصرية", poster: "https://i.ibb.co/vx3FTWpm/70k-Tz0-Omjj-Ze7z-Hv-IDrq2i-KW7-PJ-scaled-433x650.jpg" }
        ];

        function filterMovies(filter = 'الكل') {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';
            movies.forEach(movie => {
                if ((filter === 'الكل' || movie.category === filter) && movie.title.toLowerCase().includes(query)) {
                    grid.innerHTML += `<div class="movie-card"><img src="${movie.poster}"><div class="movie-title">${movie.title}</div><a href="#" class="watch-btn">شاهد الآن</a></div>`;
                }
            });
            if(filter !== 'الكل') closeNav();
        }
        filterMovies();
    </script>
</body>
</html>
