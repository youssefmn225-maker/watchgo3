<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - عالم السينما</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #9b51e0; --bg: #050505; --card-bg: #121212; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        
        .header { background: rgba(10, 10, 10, 0.95); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--primary); position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-container img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary); }
        .logo-text { font-size: 20px; font-weight: bold; }
        .icon-btn { font-size: 24px; cursor: pointer; }

        #searchBox { display: none; padding: 15px; background: #1a1a1a; }
        #searchBox input { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #000; color: #fff; text-align: center; }

        .side-nav { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #111; transition: 0.4s; padding-top: 60px; border-right: 2px solid var(--primary); }
        
        .main-menu-btn { background: #1a1a1a; margin: 10px 15px; border-radius: 12px; border: 1px solid #333; padding: 15px 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        
        .sub-menu { display: none; background: #000; padding: 5px 30px; }
        .sub-menu a { padding: 12px 10px; display: block; color: #ccc; text-decoration: none; border-bottom: 1px solid #1a1a1a; }
        .sub-menu a:hover { color: var(--primary); }
        
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 35px; color: var(--primary); }

        /* تعديل حجم الكروت */
        .movies-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; padding: 20px; }
        .movie-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .movie-card img { width: 100%; height: 280px; object-fit: cover; }
        .watch-btn { display: block; background: var(--primary); color: #fff; text-align: center; padding: 15px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="https://i.ibb.co/5ggRsXdV/Red-Black-Modern-Movie-Cinema-Presentation-20260311-124846.jpg" alt="Logo">
            <span class="logo-text">WATCHGO</span>
        </div>
        <div class="header-icons">
            <i class="fa-solid fa-magnifying-glass icon-btn" onclick="toggleSearch()"></i>
            <i class="fa-solid fa-bars icon-btn" onclick="openNav()"></i>
        </div>
    </header>

    <div id="searchBox"><input type="text" id="searchInput" placeholder="ابحث باسم الفيلم..." onkeyup="filterMovies(this.value)"></div>

    <div id="mySideNav" class="side-nav">
        <a href="javascript:void(0)" class="close-btn" onclick="closeNav()">&times;</a>
        <a href="#" style="padding:15px 25px; display:block; color:white; text-decoration:none;" onclick="filterMovies('الكل')">الرئيسية</a>
        
        <div class="main-menu-btn" onclick="toggleSub('subMovies')">أفلام أجنبي ▾</div>
        <div id="subMovies" class="sub-menu">
            <a href="#" onclick="filterMovies('IMDB')">الأعلى تقييماً IMDB</a>
            <a href="#" onclick="filterMovies('إسباني')">إسباني</a>
            <a href="#" onclick="filterMovies('أمريكي')">أمريكي</a>
        </div>
        
        <div class="main-menu-btn" onclick="toggleSub('subMoviesAr')">أفلام عربي ▾</div>
        <div id="subMoviesAr" class="sub-menu">
            <a href="#" onclick="filterMovies('مصرية')">مصرية</a>
            <a href="#" onclick="filterMovies('خليجية')">خليجية</a>
        </div>
    </div>

    <div class="movies-container" id="movies-grid"></div>

    <script>
        function openNav() { document.getElementById("mySideNav").style.width = "250px"; }
        function closeNav() { document.getElementById("mySideNav").style.width = "0"; }
        function toggleSub(id) { document.getElementById(id).style.display = (document.getElementById(id).style.display === "block") ? "none" : "block"; }
        function toggleSearch() { let box = document.getElementById("searchBox"); box.style.display = (box.style.display === "block") ? "none" : "block"; }

        const movies = [
            { title: "CIA", category: "أمريكي", poster: "https://i.ibb.co/xS9g9zf9/MV5-BNz-Zj-Nj-Rm-ODkt-MDZj-OC00-Mzcw-LWI4-N2-It-YTI5-OWY1-YTI2-ZGZl-Xk-Ey-Xk-Fqc-Gc-449x650.jpg" },
            { title: "FBI", category: "أمريكي", poster: "https://i.ibb.co/TqtRdpKX/zf-KS4-WL0-OZ9udp-No-SYZw91-VB3a-H-scaled-433x650.jpg" },
            { title: "Criminal Minds", category: "أمريكي", poster: "https://i.ibb.co/nqNxs4f7/n-Op-JLL-4f-424x650.jpg" },
            { title: "The Rookie", category: "أمريكي", poster: "https://i.ibb.co/vx3FTWpm/70k-Tz0-Omjj-Ze7z-Hv-IDrq2i-KW7-PJ-scaled-433x650.jpg" },
            { title: "Action", category: "إسباني", poster: "https://i.ibb.co/S48J73Ys/MV5-BNWU4-Zj-M3-Mj-Qt-ZTAw-MS00-YTY4-LWJh-Ym-Et-ZTFi-MTAx-Nzc4-OGFj-Xk-Ey-Xk-Fqc-Gc-V1-scaled-433x650.jpg" },
            { title: "Mystery", category: "إسباني", poster: "https://i.ibb.co/TxbY9Q73/g0j-VBv-4f-464x650.jpg" }
        ];

        function filterMovies(query = 'الكل') {
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';
            
            movies.forEach(movie => {
                // البحث بالاسم أو بالتصنيف
                if (query === 'الكل' || movie.category === query || movie.title.toLowerCase().includes(query.toLowerCase())) {
                    grid.innerHTML += `<div class="movie-card"><img src="${movie.poster}"><a href="#" class="watch-btn">شاهد الآن</a></div>`;
                }
            });
            if(query !== 'الكل' && query.length > 2) closeNav();
        }
        filterMovies();
    </script>
</body>
</html>
