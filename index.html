<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #050505; color: #fff; margin: 0; font-family: sans-serif; }
        
        /* اسم الموقع الضخم */
        .header { text-align: center; padding: 40px 20px; font-size: 45px; font-weight: 800; color: #fff; text-shadow: 0 0 15px #bf00ff; }
        
        /* شبكة البوسترات (5 صفوف) */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        
        /* كارت الفيلم (حجم توب سيما) */
        .card { background: #1a1a1a; border-radius: 8px; border: 1px solid #333; overflow: hidden; transition: 0.3s; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card h3 { padding: 8px; font-size: 13px; text-align: center; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info { padding: 0 5px 8px; font-size: 11px; color: #e11d48; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">WatchGo</div>
    <div class="grid">
        <script>
            for(let i=0; i<10; i++) {
                document.write(`
                    <div class="card">
                        <img src="https://via.placeholder.com/200x300" alt="بوستر">
                        <h3>اسم الفيلم الجبار</h3>
                        <div class="info">⭐ 8.5 | جودة عالية</div>
                    </div>
                `);
            }
        </script>
    </div>
</body>
</html>
