<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - تجربة سينمائية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #9b51e0;
            --bg: #050505;
            --card-bg: #121212;
            --text: #ffffff;
        }

        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        
        /* الهيدر */
        .header { background: rgba(10, 10, 10, 0.95); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--primary); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary); box-shadow: 0 0 10px var(--primary); }
        .header-icons { display: flex; align-items: center; gap: 15px; }
        .icon-btn { font-size: 24px; cursor: pointer; color: var(--text); }

        /* البحث */
        #searchBox { display: none; padding: 15px; background: #1a1a1a; border-bottom: 2px solid var(--primary); }
        #searchBox input { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #000; color: #fff; outline: none; text-align: center; }

        /* القائمة الجانبية */
        .side-nav { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #111; overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-right: 2px solid var(--primary); }
        .side-nav a { padding: 15px 25px; text-decoration: none; font-size: 16px; color: var(--text); display: block; border-bottom: 1px solid #222; cursor: pointer; }
        .sub-menu { display: none; background: #1a1a1a; padding-right: 20px; }
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; }

        /* الكروت */
        .movies-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; }
        .movie-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; transition: transform 0.3s; border: 1px solid #333; }
        .movie-card:hover { transform: scale(1.03); border-color: var(--primary); }
        .movie-card img { width: 100%; height: 230px; object-fit: cover; }
        .movie-title { padding: 10px; font-size: 14px; text-align: center; font-weight: bold; }
        .watch-btn { display: block; background: linear-gradient(45deg, var(--primary), #d91c8c); color: #fff; text-align: center; padding: 12px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo"><img src="https://i.ibb.co/5ggRsXdV/Red-Black-Modern-Movie-Cinema-Presentation-20260311-124846.jpg" alt="Logo"></div>
        <div class="header-icons">
            <i class="fa-solid fa-magnifying-glass icon-btn" onclick="toggleSearch()"></i>
            <i class="fa-solid fa-bars icon-btn" onclick="openNav()"></i>
        </div>
    </header>

    <div id="searchBox"><input type="text" id="searchInput" placeholder="ابحث عن فيلم..." onkeyup="filterMovies()"></div>

    <div id="mySideNav" class="side-nav">
        <a href="javascript:void(0)" class="close-btn" onclick="closeNav()">&times;</a>
        <a href="#" onclick="filterMovies('الكل')">الرئيسية</a>
        <a href="#" onclick="toggleSub('subMovies')">أفلام أجنبي ▾</a>
        <div id="subMovies" class="sub-menu">
            <a href="#" onclick="filterMovies('إسباني')">إسباني</a>
            <a href="#" onclick="filterMovies('أمريكي')">أمريكي</a>
            <a href="#" onclick="filterMovies('فرنسي')">فرنسي</a>
            <a href="#" onclick="filterMovies('تركي')">تركي</a>
        </div>
        <a href="#" onclick="filterMovies('أنمي')">أنمي</a>
        <a href="#" onclick="filterMovies('أنميشن')">أنميشن</a>
    </div>

    <div class="movies-container" id="movies-grid"></div>

    <script>
        function openNav() { document.getElementById("mySideNav").style.width = "250px"; }
        function closeNav() { document.getElementById("mySideNav").style.width = "0"; }
        function toggleSub(id) { document.getElementById(id).style.display = (document.getElementById(id).style.display === "block") ? "none" : "block"; }
        function toggleSearch() { document.getElementById("searchBox").style.display = (document.getElementById("searchBox").style.display === "block") ? "none" : "block"; }

        const movies = [
            { title: "CIA", category: "أمريكي", poster: "https://i.ibb.co/xS9g9zf9/MV5-BNz-Zj-Nj-Rm-ODkt-MDZj-OC00-Mzcw-LWI4-N2-It-YTI5-OWY1-YTI2-ZGZl-Xk-Ey-Xk-Fqc-Gc-449x650.jpg" },
            { title: "FBI", category: "أمريكي", poster: "https://i.ibb.co/TqtRdpKX/zf-KS4-WL0-OZ9udp-No-SYZw91-VB3a-H-scaled-433x650.jpg" },
            { title: "The Rookie", category: "أمريكي", poster: "https://i.ibb.co/vx3FTWpm/70k-Tz0-Omjj-Ze7z-Hv-IDrq2i-KW7-PJ-scaled-433x650.jpg" },
            { title: "Criminal Minds", category: "أمريكي", poster: "https://i.ibb.co/nqNxs4f7/n-Op-JLL-4f-424x650.jpg" },
            { title: "Action Force", category: "إسباني", poster: "https://i.ibb.co/S48J73Ys/MV5-BNWU4-Zj-M3-Mj-Qt-ZTAw-MS00-YTY4-LWJh-Ym-Et-ZTFi-MTAx-Nzc4-OGFj-Xk-Ey-Xk-Fqc-Gc-V1-scaled-433x650.jpg" },
            { title: "The Last Scene", category: "إسباني", poster: "https://i.ibb.co/TxbY9Q73/g0j-VBv-4f-464x650.jpg" }
        ];

        function filterMovies(filter = 'الكل') {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';
            movies.forEach(movie => {
                if ((filter === 'الكل' || movie.category === filter) && movie.title.toLowerCase().includes(query)) {
                    grid.innerHTML += `<div class="movie-card"><img src="${movie.poster}"><div class="movie-title">${movie.title}</div><a href="#" class="watch-btn">شاهد الآن</a></div>`;
                }
            });
            if(filter !== 'الكل') closeNav();
        }
        filterMovies();
    </script>
</body>
</html>
