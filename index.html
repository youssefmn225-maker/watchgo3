<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: linear-gradient(180deg, #1a001a, #000); color: #fff; margin: 0; font-family: sans-serif; }
        .header { text-align: center; padding: 20px; font-size: 24px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: #111; border-radius: 12px; border: 1px solid #444; overflow: hidden; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card h3 { padding: 10px; font-size: 14px; text-align: center; margin: 0; }
        .info { padding: 5px; font-size: 12px; color: #ccc; text-align: center; }
    </style>
</head>
<body>
    <div class="header">WatchGo</div>
    <div class="grid">
        <div class="card">
            <img src="https://via.placeholder.com/200x300" alt="بوستر">
            <h3>اسم الفيلم</h3>
            <div class="info">⭐ 7.5 | 2026</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/200x300" alt="بوستر">
            <h3>اسم الفيلم</h3>
            <div class="info">⭐ 7.5 | 2026</div>
        </div>
    </div>
</body>
</html>
