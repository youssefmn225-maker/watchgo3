<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchGo - عالم السينما</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #9b51e0; --bg: #050505; --card-bg: #121212; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        
        .header { background: rgba(10, 10, 10, 0.95); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--primary); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-container img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); }
        .logo-text { font-size: 18px; font-weight: bold; }

        /* القائمة الجانبية (تم تعديل التموضع لتظهر بشكل متراكب) */
        .side-nav { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #000; overflow-x: hidden; transition: 0.4s; padding-top: 20px; border-left: 2px solid var(--primary); box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        
        /* زر الإغلاق الجديد */
        .close-btn { font-size: 30px; margin: 10px 20px; display: block; color: var(--primary); cursor: pointer; border: 2px solid var(--primary); width: 40px; height: 40px; text-align: center; border-radius: 50%; line-height: 35px; }
        
        /* تنسيق الأزرار الرئيسية */
        .main-menu-btn { background: #121212; margin: 10px 20px; border-radius: 10px; border: 1px solid #333; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; }
        .main-menu-btn:hover { border-color: var(--primary); background: #1a1a1a; }
        
        .sub-menu { display: none; background: #0a0a0a; padding: 5px 35px; margin-bottom: 10px; }
        .sub-menu a { color: #ccc; padding: 10px 0; display: block; border-bottom: 1px solid #222; }

        .movies-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; }
        .movie-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .movie-card img { width: 100%; height: 200px; object-fit: cover; }
        .watch-btn { display: block; background: var(--primary); color: #fff; text-align: center; padding: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="https://i.ibb.co/5ggRsXdV/Red-Black-Modern-Movie-Cinema-Presentation-20260311-124846.jpg" alt="Logo">
            <span class="logo-text">WATCHGO</span>
        </div>
        <i class="fa-solid fa-bars" style="font-size: 24px; cursor: pointer;" onclick="openNav()"></i>
    </header>

    <div id="mySideNav" class="side-nav">
        <span class="close-btn" onclick="closeNav()">&times;</span>
        <div style="padding: 20px;">
            <a href="#" style="color:white; text-decoration:none; margin: 20px; display:block;" onclick="filterMovies('الكل')">الرئيسية</a>
            
            <div class="main-menu-btn" onclick="toggleSub('subMovies')">أفلام أجنبي ▾</div>
            <div id="subMovies" class="sub-menu">
                <a href="#" onclick="filterMovies('IMDB')">الأعلى تقييماً ⭐</a>
                <a href="#" onclick="filterMovies('إسباني')">إسباني</a>
                <a href="#" onclick="filterMovies('أمريكي')">أمريكي</a>
            </div>
            
            <div class="main-menu-btn" onclick="toggleSub('subMoviesAr')">أفلام عربي ▾</div>
            <div id="subMoviesAr" class="sub-menu">
                <a href="#" onclick="filterMovies('مصرية')">مصرية</a>
            </div>

            <div class="main-menu-btn" onclick="toggleSub('subSeries')">مسلسلات أجنبي ▾</div>
            <div id="subSeries" class="sub-menu">
                <a href="#" onclick="filterMovies('IMDB-M')">الأعلى تقييماً ⭐</a>
                <a href="#" onclick="filterMovies('أمريكي-م')">أمريكي</a>
            </div>
        </div>
    </div>

    <div class="movies-container" id="movies-grid"></div>

    <script>
        function openNav() { document.getElementById("mySideNav").style.width = "85%"; }
        function closeNav() { document.getElementById("mySideNav").style.width = "0"; }
        function toggleSub(id) { document.getElementById(id).style.display = (document.getElementById(id).style.display === "block") ? "none" : "block"; }

        const movies = [
            { title: "CIA", category: "أمريكي", poster: "https://i.ibb.co/xS9g9zf9/MV5-BNz-Zj-Nj-Rm-ODkt-MDZj-OC00-Mzcw-LWI4-N2-It-YTI5-OWY1-YTI2-ZGZl-Xk-Ey-Xk-Fqc-Gc-449x650.jpg" },
            { title: "FBI", category: "أمريكي", poster: "https://i.ibb.co/TqtRdpKX/zf-KS4-WL0-OZ9udp-No-SYZw91-VB3a-H-scaled-433x650.jpg" },
            { title: "Criminal Minds", category: "أمريكي", poster: "https://i.ibb.co/nqNxs4f7/n-Op-JLL-4f-424x650.jpg" },
            { title: "The Rookie", category: "أمريكي", poster: "https://i.ibb.co/vx3FTWpm/70k-Tz0-Omjj-Ze7z-Hv-IDrq2i-KW7-PJ-scaled-433x650.jpg" },
            { title: "Action", category: "إسباني", poster: "https://i.ibb.co/S48J73Ys/MV5-BNWU4-Zj-M3-Mj-Qt-ZTAw-MS00-YTY4-LWJh-Ym-Et-ZTFi-MTAx-Nzc4-OGFj-Xk-Ey-Xk-Fqc-Gc-V1-scaled-433x650.jpg" },
            { title: "Mystery", category: "إسباني", poster: "https://i.ibb.co/TxbY9Q73/g0j-VBv-4f-464x650.jpg" }
        ];

        function filterMovies(filter = 'الكل') {
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';
            movies.forEach(movie => {
                if (filter === 'الكل' || movie.category === filter) {
                    grid.innerHTML += `<div class="movie-card"><img src="${movie.poster}"><a href="#" class="watch-btn">شاهد الآن</a></div>`;
                }
            });
            closeNav();
        }
        filterMovies();
    </script>
</body>
</html>
